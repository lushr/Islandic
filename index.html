<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9f1f7"><title>Icelandic Phrase Cards</title><link rel="stylesheet" href="style.css?v=5"></head>
<body><main class="app"><div class="counter" id="counter">1 / 8</div>
<section class="card" id="card" role="button" tabindex="0" aria-label="Flip flashcard" aria-pressed="false">
<div class="card-content"><div id="front" class="face"><p class="eyebrow">ICELANDIC</p><h2 id="phrase"></h2><p id="pronunciation" class="pronunciation"></p></div><div id="back" class="face hidden"><p class="eyebrow">ENGLISH</p><p id="english" class="english"></p></div></div>
<button id="play" class="play" type="button" aria-label="Play audio">▶</button><p id="audioStatus" class="status" aria-live="polite"></p></section>
<nav aria-label="Navigate cards"><button id="prev" aria-label="Previous card">←</button><button id="next" aria-label="Next card">→</button></nav></main><script src="script.js?v=4"></script></body></html>
