<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9f1f7"><title>Islandic</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/svg+xml" href="snowflake.svg"><link rel="apple-touch-icon" href="snowflake.svg"><meta name="apple-mobile-web-app-title" content="Islandic"><meta name="application-name" content="Islandic"><link rel="stylesheet" href="style.css?v=14"><style>.set-selector{display:flex;gap:12px;justify-content:center;margin-bottom:18px}.set-selector button{width:auto;min-width:88px;padding:9px 12px;background:#fff}.set-selector button[aria-pressed="true"]{filter:saturate(1.25);box-shadow:3px 3px 0 #1b2730,inset 0 0 0 2px #1b2730}</style></head>
<body><main class="app"><header class="app-header"><img src="snowflake.svg" alt="" class="brand-icon"><div class="brand-text"><h1>Íslenska <span>for Dummies</span></h1><p class="brand-subtitle">A little Icelandic, a lot of attitude</p></div></header><p class="eyebrow sets-heading">CARD SETS</p><div class="set-selector" role="group" aria-label="Card sets"><button type="button" id="setPhrases" aria-pressed="true">Phrases</button><button type="button" id="setFun" aria-pressed="false">For Fun</button><button type="button" id="setPlaces" aria-pressed="false">Places</button></div>
<section class="card" id="card" role="button" tabindex="0" aria-label="Flip flashcard" aria-pressed="false">
<div class="card-content"><div id="front" class="face"><p class="eyebrow">ENGLISH</p><p id="english" class="english"></p></div><div id="back" class="face hidden"><p class="eyebrow">ICELANDIC</p><h2 id="phrase"></h2><p id="pronunciation" class="pronunciation"></p></div></div>
<nav class="card-navigation" aria-label="Navigate cards">
<button id="prev" type="button" aria-label="Previous card">←</button>
<div class="audio-stack"><span id="speed" class="speed-label" aria-live="polite">1×</span><div class="audio-controls"><button id="slower" class="speed-button" type="button" aria-label="Slow down audio">−</button><button id="play" class="play" type="button" aria-label="Play audio">▶</button><button id="faster" class="speed-button" type="button" aria-label="Speed up audio">+</button></div></div>
<button id="next" type="button" aria-label="Next card">→</button>
</nav><div class="counter" id="counter" aria-live="polite">1 / 8</div><p id="audioStatus" class="status" aria-live="polite"></p></section>
</main><script src="script.js?v=16"></script></body></html>
